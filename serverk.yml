# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: minecraft
  name:
    ar: ماينكرافت
    en: Minecraft
  description:
    ar: سيرفر ماينكرافت (جافا) — نسخة أصلية، يشتغل على طول بدون أي إعداد.
    en: Minecraft Java Edition — vanilla, running the moment your order completes.
  tagline:
    ar: أشهر لعبة في العالم — سيرفرك جاهز خلال دقيقة
    en: The world's biggest game — your server, ready in a minute
  category: sandbox
  logo: assets/logo.webp
  banner: assets/banner.webp

resources:
  minMemoryMb: 1024
  recommendedMemoryMb: 4096
  minDiskMb: 5120
  playersPerMemoryGb: 5

container:
  image: serverkgg/minecraft
  runtime:
    platform: linux
    installBudgetMinutes: 15
    bootBudgetMinutes: 12
    shmMb: 64
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 25565
      protocol: tcp
      name:
        ar: جافا
        en: Java
      hint:
        ar: في ماينكرافت جافا اكتب العنوان بس في خانة السيرفر، ما تحتاج منفذ.
        en: In Minecraft Java, type the address alone in the server field, no port needed.
      hostRange:
        default: 25565
        min: 25565
        max: 25664
      srv:
        service: _minecraft
    - key: bedrock
      containerPort: 19132
      protocol: udp
      name:
        ar: بيدروك
        en: Bedrock
      hint:
        ar: في بيدروك حط العنوان في خانة "عنوان السيرفر" والمنفذ في خانة "المنفذ".
        en: In Bedrock, put the address in the "Server Address" field and the port in the "Port" field.
      join: separate
      hostRange:
        default: 19132
        min: 19132
        max: 19231
      activeWhen:
        - variable: SERVER_TYPE
          values:
            - paper
            - purpur
            - fabric
            - neoforge
        - variable: CROSSPLAY
          values:
            - "true"

backup:
  except:
    - libraries/**
    - versions/**
    - logs/**
    - crash-reports/**
    - cache/**
    - .fabric/**
    - .serverk-staging/**
    - server.jar
    - run.sh
    - run.bat
    - user_jvm_args.txt

secrets:
  - key: MODRINTH_API_KEY
    description:
      ar: مفتاح Modrinth API — يرفع حدود الطلبات لكتالوج الإضافات والمودات.
      en: Modrinth API key — raises rate limits for the plugin and mod catalog.
    required: false
  - key: CURSEFORGE_API_KEY
    description:
      ar: مفتاح CurseForge API — بدونه ما يشتغل مصدر كيرس فورج في كتالوج المودات ولا في المودباكات.
      en: CurseForge API key — without it the CurseForge source stays off in both the mod catalog and the modpacks tab.
    required: false
  - key: HANGAR_API_KEY
    description:
      ar: مفتاح Hangar API — يرفع حدود الطلبات لكتالوج إضافات بيبر.
      en: Hangar API key — raises rate limits for the Paper plugin catalog.
    required: false

reset:
  keep: []

presence:
  name: player
  avatar: "https://mc-heads.net/avatar/{skin}/128"
  fields:
    - key: platform
      label:
        ar: المنصة
        en: Platform

files:
  protected:
    - libraries
    - versions
    - eula.txt
    - .fabric
    - run.sh
    - run.bat
    - .serverk-install.json
    - .serverk-crashscan.json
    - .serverk-companions.json
    - .serverk-modpack.json
    - plugins/.serverk-catalog.json
    - mods/.serverk-catalog.json
    - plugins/floodgate/key.pem
    - config/floodgate/key.pem
    - "**/session.lock"
    - "**/level.dat_old"
  notable:
    - match: server.properties
      label:
        ar: إعدادات
        en: Settings
      icon: settings
      color: "#5ba32b"
      restart: true
      note:
        ar: إعدادات السيرفر الأساسية — الاسم، عدد اللاعبين، الصعوبة، ووضع اللعب. أي تعديل يبي إعادة تشغيل.
        en: The core server settings — name, player slots, difficulty and game mode. Any change needs a restart.
    - match: world
      label:
        ar: الماب
        en: World
      icon: map
      color: "#4a8fd4"
      note:
        ar: الماب حقك. لا تحذفه إلا وأنت متأكد، وخذ نسخة احتياطية قبل أي تعديل.
        en: Your world. Do not delete it unless you are sure, and take a backup before touching it.
    - match: "world/**"
      label:
        ar: بيانات الماب
        en: World data
      icon: map
      color: "#4a8fd4"
      note:
        ar: جزء من بيانات الماب. تعديله وأنت شغّال ممكن يخرب حفظ اللعبة.
        en: Part of your world data. Editing it while the server runs can corrupt the save.
    - match: plugins
      label:
        ar: الإضافات
        en: Plugins
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مجلد الإضافات. حط ملفات jar هنا وأعد التشغيل عشان تشتغل.
        en: Your plugins folder. Drop jar files here and restart for them to load.
    - match: mods
      label:
        ar: المودات
        en: Mods
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مجلد المودات. لازم كل اللاعبين يكون عندهم نفس المودات عشان يدخلون.
        en: Your mods folder. Every player needs the same mods to be able to join.
    - match: ops.json
      label:
        ar: الأدمن
        en: Admins
      icon: shield
      color: "#e0a458"
      note:
        ar: قائمة الأدمن. اللي هنا يقدر يستخدم أوامر الإدارة داخل اللعبة.
        en: The admin list. Anyone here can run operator commands in game.
    - match: whitelist.json
      label:
        ar: القائمة البيضاء
        en: Whitelist
      icon: users
      color: "#e0a458"
      note:
        ar: القائمة البيضاء. إذا كانت مفعّلة، بس اللي هنا يقدر يدخل.
        en: The whitelist. When it is on, only the players listed here can join.
    - match: banned-players.json
      label:
        ar: محظورين
        en: Banned
      icon: shield
      color: "#d64545"
      note:
        ar: قائمة اللاعبين المحظورين.
        en: The list of banned players.
    - match: banned-ips.json
      label:
        ar: محظورين
        en: Banned
      icon: shield
      color: "#d64545"
      note:
        ar: قائمة الـ IP المحظورة.
        en: The list of banned IP addresses.
    - match: "logs/**"
      label:
        ar: اللوق
        en: Logs
      icon: command
      color: "#8d99ae"
      note:
        ar: ملفات اللوق. ارجع لها إذا صار خلل وتبي تعرف وش صار.
        en: Log files. Check these when something breaks and you need to know why.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: features
    name:
      ar: مميزات
      en: Features

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: من إنشاء السيرفر حتى دخول أول لاعب — كل شيء خلال دقائق.
      en: From creating the server to the first player joining — all in minutes.
    tags:
      - start
    surfaces:
      - overview
      - console
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: server-type
    title:
      ar: نوع السيرفر والنسخة — وش يصير لمابك
      en: Server type and version — what happens to your world
    summary:
      ar: بدّل بين فانيلا و Paper و Purpur و Fabric و Forge و NeoForge، أو غيّر نسختك، وأنت عارف وش يبقى ووش يروح.
      en: Move between Vanilla, Paper, Purpur, Fabric, Forge and NeoForge, or change your version, knowing what stays and what goes.
    tags:
      - features
    surfaces:
      - overview
      - panel
    bodyPath:
      ar: guides/server-type/ar.md
      en: guides/server-type/en.md
  - id: crossplay
    title:
      ar: كروس بلاي — لاعبي بيدروك في سيرفرك
      en: Crossplay — Bedrock players on your server
    summary:
      ar: فعّل زر واحد وخل أصحابك من الجوال والكونسول وويندوز يدخلون سيرفر الجافا حقك.
      en: Flip one switch and let friends on phone, console and Windows join your Java server.
    tags:
      - features
    surfaces:
      - overview
      - panel
    bodyPath:
      ar: guides/crossplay/ar.md
      en: guides/crossplay/en.md
  - id: modpacks
    title:
      ar: المودباك — سيرفر جاهز بضغطة
      en: Modpacks — a ready-made server in one click
    summary:
      ar: اختر مودباك من الكتالوج وإحنا نركّب المودات والإعدادات ونجهّز سيرفرك عليه.
      en: Pick a modpack from the catalog and we install its mods and configs and set your server up for it.
    tags:
      - features
    surfaces:
      - overview
      - panel
    bodyPath:
      ar: guides/modpacks/ar.md
      en: guides/modpacks/en.md
  - id: version-compat
    title:
      ar: توافق النسخ — نسخ جافا الثانية في سيرفرك
      en: Version compatibility — other Java versions on your server
    summary:
      ar: فعّل زر واحد وخل أصحابك يدخلون بنسخة جافا أحدث أو أقدم من نسخة سيرفرك.
      en: Flip one switch and let friends join on a Java version newer or older than your server.
    tags:
      - features
    surfaces:
      - overview
      - panel
    bodyPath:
      ar: guides/version-compat/ar.md
      en: guides/version-compat/en.md
  - id: worlds
    title:
      ar: المابات — بدّل وارفع وصفّر
      en: Worlds — switch, upload and reset
    summary:
      ar: بدّل الماب الشغّالة، ارفع ماب من جهازك، صفّر النذر والإند، واحذف اللي ما تحتاجه.
      en: Switch the active world, upload one from your computer, reset the Nether and the End, and delete what you do not need.
    tags:
      - features
    surfaces:
      - panel
      - files
      - backups
    bodyPath:
      ar: guides/worlds/ar.md
      en: guides/worlds/en.md
